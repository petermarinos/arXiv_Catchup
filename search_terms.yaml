# Search terms file
# See README for important notes

# Define categories to search
# At least one is required
# Examples shown only for astro-ph categories. If searching other fields, e.g. physics or computer science, find the correct format from arXiv https://arxiv.org/category_taxonomy
Categories :
  # - astro-ph*   # All astrophysics categories
  # - astro-ph.CO # Cosmology and Nongalactic Astrophysics
  # - astro-ph.EP # Earth and Planetary Astrophysics
  # - astro-ph.GA # Astrophysics of Galaxies
  # - astro-ph.HE # High Energy Astrophysical Phenomena
  # - astro-ph.IM # Instrumentation and Methods for Astrophysics
  # - astro-ph.SR # Solar and Stellar Astrophysics

# Authors of interest
# More information => better matching
# For example, inputting `Andrew Sydney Withiel Thomas` will match with paper authors including `Andrew Sydney Withiel Thomas`, and lower-information representations such as `Andrew S. W. Thomas`, `A. Thomas`, `Thomas`, etc., while excluding `A. S. Z. Thomas`, etc.
# Do not include particles or suffixes, e.g. write `Ludwig Beethoven` instead of `Ludwig van Beethoven`
Authors :
  # - examplename

# Key words to search for
Included Words :
  # - exampleword

# Words that exclude papers being shown
Excluded Words :
  # - exampleword
